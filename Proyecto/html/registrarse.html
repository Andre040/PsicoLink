<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsicoLink | Iniciar sesión</title>
    <link href="../style/styles.css" rel="stylesheet" type="text/css">
  </head>
  <body>
    <header class="topbar">
     <a href="#" class="brand" aria-label="PsicoLink">
    <img src="../img/logo.png" alt="PsicoLink" class="brand-logo" />
    </a>
    </header>

    <main class="hero">
      <section class="auth-card" aria-label="Inicio de sesión">
        <div class="card-brand">
        <img src="../img/logo2.png" alt="PsicoLink" class="brand-logo" />
        </div>

        <h1>Crea tu cuenta</h1>
        <p class="subtitle">Completa el formulario para registrarte.</p>

        <form>
            <div class="field">
            <label for="name">Nombre completo</label>
            <input id="name" type="text" placeholder="Tu nombre y apellido" />
          </div>


          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" placeholder="nombre@correo.com" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="Mínimo 6 caracteres" />
          </div>

          <button type="submit" class="btn-login">Crear cuenta</button>
        </form>

        <div class="text-links">
          <div>¿Ya tienes cuenta? <a href="iniciar_sesion.html">Inicia sesión</a></div>
        </div>
      </section>
    </main>
  </body>
</html>
