<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsicoLink | Iniciar sesión</title>
    <link href="../style/styles.css" rel="stylesheet" type="text/css"   >
      
  </head>
  <body>
    <header class="topbar">
     <a href="#" class="brand" aria-label="PsicoLink">
    <img src="../img/logo.png" alt="PsicoLink" class="brand-logo" />
    </a>
    </header>

    <main class="hero">
      <section class="auth-card" aria-label="Inicio de sesión">
        <div class="card-brand">
        <img src="../img/logo2.png" alt="PsicoLink" class="brand-logo" />
        </div>

        
        <h1>¡Qué bueno verte de nuevo!</h1>
        <p class="subtitle">Ingresa a tu cuenta para continuar.</p>

        <form>
          <div class="field">
            <label for="email">Correo electrónico</label>
            <input id="email" type="email" placeholder="nombre@correo.com" />
          </div>

          <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="Mínimo 6 caracteres" />
          </div>

          <button type="submit" class="btn-login">Iniciar sesión</button>
        </form>

        <div class="text-links">
          <div>¿No tienes cuenta? <a href="registrarse.html">Regístrate</a></div>
          <div><a href="#">¿Olvidaste tu contraseña?</a></div>
          
          
        </div>
      </section>
    </main>
  </body>
</html>
