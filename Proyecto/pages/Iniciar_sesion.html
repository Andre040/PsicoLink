<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsicoLink | Iniciar sesión</title>
    <link href="../style/styles.css" rel="stylesheet" type="text/css"   >
      
  </head>
  <body>
    <header class="public-header">
      <a href="index.html" class="brand" aria-label="PsicoLink">
        <img src="../img/logo.png" alt="PsicoLink">
      </a>
    </header>

    <main class="auth-shell">
      <section class="auth-card" aria-label="Inicio de sesion">
        <img src="../img/logo2.png" alt="PsicoLink" class="auth-logo">
        <h1>Que bueno verte de nuevo</h1>
        <p class="auth-subtitle">Ingresa a tu cuenta para continuar.</p>

        <form action="Citas.php" method="post">
          <div class="form-group">
            <label for="email">Correo electronico</label>
            <input class="form-control" id="email" name="email" type="email" placeholder="nombre@correo.com" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" placeholder="Minimo 6 caracteres" minlength="6" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Iniciar sesion</button>
        </form>

        <p class="auth-bottom">
          ¿No tienes cuenta? <a class="link-btn" href="registrarse.html">Registrate</a><br>
          <a class="link-btn" href="index.html">Volver al inicio</a>
        </p>
      </section>
    </main>
  </body>
</html>
