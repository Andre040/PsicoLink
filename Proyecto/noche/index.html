<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087fc4">
  <title>PsicoLink | Bienestar emocional</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="public-header" id="publicHeader">
      <a href="#" class="brand" data-view="home"><img src="assets/logo-psicolink.png" alt="Logo PsicoLink"></a>
      <button class="mobile-menu-btn" id="publicMenuBtn" aria-label="Abrir menú">☰</button>
      <nav class="public-nav" id="publicNav">
        <a href="#como-funciona" data-scroll="como-funciona">Cómo funciona</a>
        <a href="#beneficios" data-scroll="beneficios">Beneficios</a>
        <button class="btn btn-outline" data-view="login">Iniciar sesión</button>
        <button class="btn btn-primary" data-view="register">Crear cuenta</button>
      </nav>
    </header>
    <main id="mainContent"></main>
    <footer class="public-footer" id="publicFooter">
      <div class="footer-brand"><img src="assets/logo-psicolink.png" alt="PsicoLink"><span>Conectando personas con su bienestar.</span></div>
      <span>© <span id="year"></span> PsicoLink · Proyecto demostrativo</span>
    </footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
