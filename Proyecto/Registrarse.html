<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Regístrate</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page">
      <div class="card">
        <div class="brand" aria-label="Logo de la aplicación">
            <img src="img/Solo logo (1).png">
        </div>

        <h1>Regístrate</h1>

        <form>
          <div class="field" aria-label="Nombre completo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 21a8 8 0 0 0-16 0"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input type="text" placeholder="Nombre completo" />
          </div>

          <div class="field" aria-label="Correo electrónico">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="M4 7l8 6 8-6"></path>
            </svg>
            <input type="email" placeholder="Correo electrónico" />
          </div>

          <div class="field" aria-label="Contraseña">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"></rect>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            </svg>
            <input type="password" placeholder="Contraseña" />
          </div>

          <div class="field" aria-label="Confirmar contraseña">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"></rect>
              <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
            </svg>
            <input type="password" placeholder="Confirmar contraseña" />
          </div>

          <div class="button-wrap">
            <button type="submit">Registrarme</button>
          </div>
        </form>

        <p class="login">¿Ya tienes cuenta? <a href="Iniciar_sesion.html">Inicia sesión</a></p>
      </div>
    </div>
  </body>
</html>
